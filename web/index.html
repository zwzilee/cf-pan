<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>东东的R2盘</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%97%82%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --bg:#0a0d13; --bg2:#0e1219; --card:#121826; --card2:#161e2e; --line:#212b3d; --line2:#2b364c;
  --fg:#e9eefa; --mut:#8a97ad; --mut2:#5f6b80;
  --acc:#4f8cff; --acc2:#6ea1ff; --ok:#2ec27e; --warn:#f5a524; --err:#f2555a; --purple:#a273ff;
  --r:14px; --shadow:0 20px 50px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#263145;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#33415c}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 通用控件 ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card2);
  color:var(--fg);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{background:#1c2740;border-color:#38466a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--acc2),var(--acc));border-color:transparent;color:#fff;font-weight:600;
  box-shadow:0 10px 24px -12px var(--acc)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb4b6;border-color:#4a2a2e;background:#221519}
.btn.danger:hover{background:#2e1a1f}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.input{width:100%;background:#0c111b;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13px;outline:none;transition:.15s}
.input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.mut{color:var(--mut);font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:99px;
  border:1px solid var(--line2);color:var(--mut)}
.pill.ok{color:#7ee2b0;border-color:#1f4a38;background:#0f2419}
.pill.warn{color:#ffcf7a;border-color:#4d3a12;background:#241c0b}
.pill.err{color:#ffb0b3;border-color:#4a2326;background:#241214}
.pill.acc{color:#a8c8ff;border-color:#1f3357;background:#0f1a2e}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.hide{display:none !important}
.empty{padding:56px 20px;text-align:center;color:var(--mut2)}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.5}
.toast-wrap{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:9999}
.toast{background:#182136;border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:10px;
  padding:10px 16px;font-size:13px;box-shadow:var(--shadow);animation:slide .22s ease;max-width:340px}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--err)}
@keyframes slide{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- 页内对话框（替代原生 prompt/confirm） ---------- */
/* 侧栏抽屉的遮罩单独一套：不能复用对话框的 .mask（z-index:9998 会把侧栏一起压暗） */
#mask{position:fixed;inset:0;background:rgba(4,7,12,.5);z-index:55;display:block;padding:0;animation:none}
@media(min-width:861px){#mask{display:none !important}}
.mask{position:fixed;inset:0;background:rgba(4,7,12,.74);
  display:grid;place-items:center;z-index:9998;padding:20px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{width:100%;max-width:420px;background:#141b2b;border:1px solid var(--line2);border-radius:16px;
  padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.dlg h3{margin:0 0 12px;font-size:16px;color:var(--fg)}
.dlg p{margin:0 0 14px;color:var(--mut);font-size:13px;line-height:1.6;word-break:break-all}
.dlg input{width:100%;margin-bottom:18px;font-size:14px;padding:11px 13px;height:auto}
.dlg .foot{display:flex;gap:10px;justify-content:flex-end}
.dlg .btn.sm{padding:8px 16px;font-size:13px}
input::placeholder,textarea::placeholder{color:#5c6a82}

/* ---------- 登录 ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(900px 500px at 50% -15%,#152238 0%,transparent 60%),
             radial-gradient(700px 400px at 110% 110%,#151f38 0%,transparent 55%),var(--bg)}
.login-card{width:min(420px,100%);background:linear-gradient(180deg,#141b2b,#101622);
  border:1px solid var(--line);border-radius:20px;padding:34px 30px 26px;box-shadow:var(--shadow)}
.logo{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;margin-bottom:18px;
  background:linear-gradient(140deg,#2a4a92,#1a2743);border:1px solid #2c3f66}
.login-card h1{font-size:19px;margin:0 0 6px}
.login-tabs{display:flex;gap:6px;background:#0b101a;border:1px solid var(--line);padding:4px;border-radius:11px;margin:20px 0 18px}
.login-tabs button{flex:1;background:transparent;border:0;color:var(--mut);padding:8px;border-radius:8px;cursor:pointer;font-size:13px}
.login-tabs button.on{background:var(--card2);color:var(--fg);box-shadow:0 1px 0 #2b364c inset}
.login-card .btn.primary{width:100%;justify-content:center;padding:11px;margin-top:6px}
.login-foot{margin-top:18px;text-align:center;color:var(--mut2);font-size:11.5px;line-height:1.9}

/* ---------- 外壳 ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:238px;flex:0 0 238px;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100%;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(140deg,#2a4a92,#1a2743);border:1px solid #2c3f66}
.brand b{font-size:14px;letter-spacing:.3px}
.brand small{display:block;color:var(--mut2);font-size:10.5px;letter-spacing:1.2px}
.nav{padding:6px 10px;flex:1;overflow:auto}
.nav .grp{color:var(--mut2);font-size:10.5px;letter-spacing:1.4px;padding:14px 10px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;color:var(--mut);font-size:13px;cursor:pointer}
.nav a:hover{background:#141c2b;color:var(--fg)}
.nav a.on{background:linear-gradient(90deg,#1b2a47,#151d2e);color:#fff;box-shadow:inset 2px 0 0 var(--acc)}
.nav a .ic{width:18px;text-align:center;font-size:14px}
.side-foot{padding:12px;border-top:1px solid var(--line);font-size:12px}
/* 总空间可视化（环形 + 进度条 + 账号数），前台后台都有 */
.storage{margin-bottom:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,#131a28,#0f1521)}
.storage .srow{display:flex;align-items:center;gap:11px}
.storage .ring{position:relative;width:46px;height:46px;flex:0 0 46px}
.storage .ring svg{display:block}
.storage .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:650;color:var(--fg)}
.storage .stxt{min-width:0;flex:1}
.storage .stxt .u{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storage .stxt .s{font-size:10.5px;color:var(--mut2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storage .sbar{height:5px;border-radius:99px;background:#0b101a;margin-top:10px;overflow:hidden}
.storage .sbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3f7bf0,#6ea1ff);transition:width .4s}
.storage .sbar i.hot{background:linear-gradient(90deg,#f5a524,#ff7a45)}
/* 账号页顶部总览 */
.acc-sum{display:flex;align-items:center;gap:20px;padding:18px 20px;margin-bottom:16px}
.acc-sum .ring{position:relative;width:96px;height:96px;flex:0 0 96px}
.acc-sum .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700}
.acc-sum .info{flex:1;min-width:0}
.acc-sum .info .big{font-size:19px;font-weight:650;margin-bottom:4px}
.acc-sum .info .sub{font-size:12px;color:var(--mut);margin-bottom:10px}
.acc-sum .sbar{height:8px;border-radius:99px;background:#0b101a;overflow:hidden}
.acc-sum .sbar i{display:block;height:100%;background:linear-gradient(90deg,#3f7bf0,#6ea1ff)}
.acc-sum .sbar i.hot{background:linear-gradient(90deg,#f5a524,#ff7a45)}
.me{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:#111826}
.avatar{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:linear-gradient(140deg,#37528c,#22304d);color:#cfe0ff}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.top{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);
  background:rgba(10,13,19,.86);backdrop-filter:blur(10px);position:relative;z-index:20}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);overflow:hidden;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:600}
.crumb span.sep{color:var(--mut2)}
.content{padding:22px 24px 40px;flex:1;min-height:0;overflow:auto}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h2{font-size:17px;margin:0}
.page-h .sub{color:var(--mut);font-size:12px}

/* ---------- 统计卡 ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:20px}
.stat{background:linear-gradient(180deg,#131a28,#101622);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .k{color:var(--mut);font-size:11.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stat .v{font-size:20px;font-weight:650;letter-spacing:.3px}
.stat .v small{font-size:12px;color:var(--mut);font-weight:400;margin-left:3px}
.stat .bar{height:5px;border-radius:99px;background:#0b101a;margin-top:10px;overflow:hidden}
.stat .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3f7bf0,#6ea1ff)}

/* ---------- 列表 ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.dl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dl-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid #1a2233}
.dl-row:last-child{border-bottom:0}
.dl-row:hover{background:#131b29}
.dl-row .nm{display:flex;align-items:center;gap:10px;min-width:0}
.dl-row .nm .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:#101826;border:1px solid var(--line);flex:0 0 32px}
.dl-row .nm .t{min-width:0}
.dl-row .nm .t b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-row .nm .t small{color:var(--mut2);font-size:11.5px}
.dl-row .acts{display:flex;gap:6px;opacity:.55;transition:.15s}
.dl-row:hover .acts{opacity:1}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;color:var(--mut);font-weight:500;font-size:11.5px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:#0f1622;position:sticky;top:0}
table.tb td{padding:11px 14px;border-bottom:1px solid #1a2233;vertical-align:middle}
table.tb tr:hover td{background:#131b29}
.mini-bar{width:90px;height:6px;border-radius:99px;background:#0b101a;overflow:hidden;display:inline-block;vertical-align:middle}
.mini-bar i{display:block;height:100%;background:linear-gradient(90deg,#2ec27e,#5fe0a8)}
.mini-bar i.hot{background:linear-gradient(90deg,#f5a524,#ff7a45)}

/* ---------- 上传 ---------- */
.drop{border:1.5px dashed #2b3a55;border-radius:var(--r);padding:26px;text-align:center;color:var(--mut);
  transition:.18s;background:#0d131f;margin-bottom:16px}
.drop.hot{border-color:var(--acc);background:#101c33;color:var(--fg)}
.up-item{display:grid;grid-template-columns:1fr 120px;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid #1a2233;font-size:12.5px}
.pbar{height:6px;border-radius:99px;background:#0b101a;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .2s}

/* ---------- 表格编辑器 ---------- */
.sheet-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 260px)}
table.grid{border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.grid th,table.grid td{border:1px solid #1e2739;padding:0;height:28px}
table.grid th{background:#111a28;color:var(--mut);font-weight:500;font-size:11px;text-align:center;
  position:sticky;top:0;z-index:3;min-width:84px}
table.grid th.rowh{position:sticky;left:0;z-index:2;min-width:42px;width:42px}
table.grid th.corner{position:sticky;left:0;top:0;z-index:4;width:42px;min-width:42px;background:#0f1622}
table.grid td input{width:100%;height:27px;border:0;background:transparent;padding:0 7px;outline:none;font-size:12.5px}
table.grid td input:focus{box-shadow:inset 0 0 0 2px var(--acc);background:#0b1524}
table.grid td.sel{background:#152238}
table.grid td input.fx{color:#8fd0ff;font-weight:600}

/* ---------- 文档编辑器 ---------- */
.doc-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.doc-split{grid-template-columns:1fr}}
.editor{width:100%;min-height:calc(100vh - 300px);background:#0c111b;border:1px solid var(--line);border-radius:12px;
  padding:16px;resize:vertical;outline:none;font:13px/1.75 ui-monospace,Consolas,monospace}
.preview{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;overflow:auto;
  min-height:calc(100vh - 300px);max-height:calc(100vh - 300px);font-size:14px;line-height:1.85}
.preview h1,.preview h2,.preview h3{line-height:1.4}
.preview h2{font-size:16px;border-left:3px solid var(--acc);padding-left:10px;margin:22px 0 8px}
.preview h3{font-size:14.5px;margin:16px 0 6px}
.preview code{background:#1a2130;padding:1px 5px;border-radius:4px;font-size:12px}
.preview pre{background:#0c111b;border:1px solid var(--line);border-radius:9px;padding:12px;overflow:auto}
.preview pre code{background:none;padding:0}
.preview blockquote{border-left:3px solid var(--line);margin:10px 0;padding:2px 14px;color:var(--mut)}
.preview table{border-collapse:collapse;width:100%;font-size:12.5px}
.preview th,.preview td{border:1px solid var(--line);padding:6px 9px}
.preview img{max-width:100%}

/* ---------- 右键菜单 ---------- */
.ctxmenu{position:fixed;z-index:9990;min-width:140px;background:#141b2b;border:1px solid var(--line2);
  border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:fade .1s ease}
.ctxmenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);
  font-size:13px;padding:8px 10px;border-radius:7px;cursor:pointer}
.ctxmenu button:hover{background:#1e2a42}
.ctxmenu button.danger{color:#ff9a9d}

/* ---------- 图片灯箱 ---------- */
.lb{position:fixed;inset:0;z-index:9997;background:rgba(2,4,8,.93);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:18px;animation:fade .15s ease}
.lb img{max-width:100%;max-height:82vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:zoom-in;transition:.18s}
.lb img.zoom{max-width:none;max-height:none;width:auto;cursor:zoom-out}
.lb .lbbar{display:flex;align-items:center;gap:10px;color:#cfd8e8;font-size:13px;flex-wrap:wrap;justify-content:center}

/* ---------- 播放器 ---------- */
.player{background:#000;border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.player video,.player audio{width:100%;display:block;max-height:74vh;background:#000}

/* ---------- 响应式 ---------- */
.burger{display:none}
@media(max-width:860px){
  .side{position:fixed;inset:0 auto 0 0;z-index:60;transform:translateX(-100%);transition:.22s;box-shadow:var(--shadow);background:#0b101a;backdrop-filter:none}
  .side.open{transform:none}
  .burger{display:inline-flex}
  .content{padding:16px 14px 90px}
  .dl-row{grid-template-columns:1fr;gap:8px}
  .dl-row .acts{opacity:1}
  .top{padding:0 12px}
}
﻿.pick input{width:15px;height:15px;accent-color:#4f8cff;cursor:pointer}
.star{color:#55627a;font-size:14px}
.star.on{color:#ffd166}
.pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#141b2b;border:1px solid #26324a;border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;z-index:9995;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.searchbox{display:flex;gap:6px;margin-left:auto;margin-right:10px}
.searchbox input{background:#0f1624;border:1px solid #253046;color:#dbe4f0;border-radius:9px;padding:7px 10px;font-size:13px;width:200px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{background:#0f1624;border:1px solid #1e2940;border-radius:12px;overflow:hidden;cursor:pointer}
.pcard img{width:100%;height:120px;object-fit:cover;display:block}
.pno{height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5c6a82;font-size:22px}
.pno span{font-size:11px;margin-top:4px}
.pnm{padding:6px 8px;font-size:12px;color:#aab7c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;gap:6px;align-items:center;background:#16203a;border:1px solid #26324a;border-radius:999px;padding:5px 10px;margin:4px;font-size:13px}
.chip a{color:#8b98ad;cursor:pointer}
.taglist{padding:12px}

</style>
<script src="/sheet-eval.js"></script>
</head>
<body>

<!-- ============ 登录 ============ -->
<div id="login" class="login-wrap hide">
  <div class="login-card">
    <div class="logo">🗂</div>
    <h1 id="loginTitle">进入 东东的R2盘</h1>
    <div class="mut" id="loginHint">多账号 R2 聚合网盘</div>
    <div class="login-tabs">
      <button id="tabFront" class="on" onclick="switchMode('front')">前台访问</button>
      <button id="tabAdmin" onclick="switchMode('admin')">管理员</button>
    </div>
    <div id="frontFields">
      <div class="field">
        <label>访问密码</label>
        <input id="frontPw" class="input" type="password" placeholder="向管理员要一个" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
    </div>
    <div id="adminFields" class="hide">
      <div class="field">
        <label>用户名</label>
        <input id="admUser" class="input" placeholder="admin" value="admin" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="admPw" class="input" type="password" onkeydown="if(event.key==='Enter')doLogin()" />
      </div>
    </div>
    <button class="btn primary" id="loginBtn" onclick="doLogin()">进入</button>
    <div class="login-foot">
      <span id="loginErr" style="color:#ffb0b3"></span><br />
      前台只能浏览与下载；上传、目录、账号、日志在管理员后台
    </div>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app" class="shell hide">
  <aside class="side" id="side">
    <div class="brand">

<div class="toast-wrap" id="toasts"></div>

<script>
/* ============================================================
   PAN R2 前端：一套壳，两套权限。can.* 决定看到什么。
   ============================================================ */
const $ = (s) => document.querySelector(s);
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- 页内对话框（不用原生 prompt/confirm，原生弹窗会把整个页面卡住） ---------- */
function dlg({ title, desc = '', value = null, placeholder = '', ok = '确定', danger = false }) {
  return new Promise((resolve) => {
    const input = value === null ? '' : `<input class="input" id="dlgIn" value="${esc(value)}" placeholder="${esc(placeholder)}">`;
    const box = el(`<div class="mask">
      <div class="dlg">
        <h3>${esc(title)}</h3>${desc ? `<p>${esc(desc)}</p>` : ''}${input}
        <div class="foot">
          <button class="btn sm" id="dlgNo">取消</button>
          <button class="btn sm ${danger ? 'danger' : 'primary'}" id="dlgYes">${esc(ok)}</button>
        </div>
      </div></div>`);
    const done = (v) => { box.remove(); document.removeEventListener('keydown', key); resolve(v); };
    const key = (e) => {
      if (e.key === 'Escape') done(null);
      if (e.key === 'Enter' && box.querySelector('#dlgIn')) done(box.querySelector('#dlgIn').value.trim() || null);
    };
    document.body.appendChild(box);
    document.addEventListener('keydown', key);
    box.addEventListener('click', (e) => { if (e.target === box) done(null); });
    box.querySelector('#dlgNo').onclick = () => done(null);
    box.querySelector('#dlgYes').onclick = () => {
      const i = box.querySelector('#dlgIn');
      done(i ? (i.value.trim() || null) : true);
    };
    const i = box.querySelector('#dlgIn');
    if (i) { i.focus(); i.select(); }
    else box.querySelector('#dlgYes').focus();
  });
}
async function ask(title, opts = {}) { return await dlg({ title, ok: '确定', ...opts }); }
async function askText(title, desc, value, placeholder, ok = '确定') { return await dlg({ title, desc, value: value ?? '', placeholder, ok }); }
async function confirmDlg(title, desc = '') { return (await dlg({ title, desc, danger: true, ok: '确定' })) !== null; }

const state = {
  user: null, can: {}, mode: 'front',
  folder: null, folders: [], path: [],
  view: 'files', fileId: null, sheetId: null, docId: null,
};

/* ---------- 基础 ---------- */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.body && !(opts.body instanceof ArrayBuffer) ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) },
    credentials: 'same-origin',
  });
  const ct = res.headers.get('Content-Type') || '';
  if (!res.ok) {
    let msg = res.status + '';
    try { msg = ct.includes('json') ? (await res.json()).error || msg : await res.text(); } catch {}
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return ct.includes('json') ? res.json() : res;
}
function toast(msg, kind = '') {
  const t = el(`<div class="toast ${kind}">${esc(msg)}</div>`);
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; t.style.transition = '.3s'; setTimeout(() => t.remove(), 320); }, 2600);
}
const bytes = (n) => {
  n = Number(n) || 0;
  const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(n < 10 ? 2 : 1) : n) + ' ' + u[i];
};
const when = (s) => { if (!s) return '—'; const d = new Date(s); return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const fileIcon = (n) => {
  const e = (n.split('.').pop() || '').toLowerCase();
  if (['mp4', 'mkv', 'mov', 'webm', 'avi'].includes(e)) return '🎬';
  if (['mp3', 'flac', 'wav', 'm4a', 'aac'].includes(e)) return '🎵';
  if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(e)) return '🖼';
  if (e === 'pdf') return '📕';
  if (['zip', 'rar', '7z', 'gz', 'tar'].includes(e)) return '🗜';
  if (['md', 'txt', 'doc', 'docx'].includes(e)) return '📄';
  return '📦';
};

/* ---------- 登录 ---------- */
function switchMode(m) {
  state.mode = m;
  $('#tabFront').classList.toggle('on', m === 'front');
  $('#tabAdmin').classList.toggle('on', m === 'admin');
  $('#frontFields').classList.toggle('hide', m !== 'front');
  $('#adminFields').classList.toggle('hide', m !== 'admin');
  $('#loginTitle').textContent = m === 'front' ? '进入前台' : '管理员登录';
  $('#loginHint').textContent = m === 'front' ? '输入访问密码，浏览与下载文件' : '管理文件、账号、日志';
  $('#loginErr').textContent = '';
}
async function doLogin() {
  const btn = $('#loginBtn'); btn.disabled = true; $('#loginErr').textContent = '';
  try {
    if (state.mode === 'front') {
      await api('/api/front/login', { method: 'POST', body: JSON.stringify({ password: $('#frontPw').value }) });
    } else {
      await api('/api/login', { method: 'POST', body: JSON.stringify({ username: $('#admUser').value, password: $('#admPw').value }) });
    }
    await boot();
  } catch (e) { $('#loginErr').textContent = e.message; }
  finally { btn.disabled = false; }
}
async function logout() {
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  location.reload();
}

/* ---------- 启动 ---------- */
async function boot() {
  let me;
  try { me = await api('/api/me'); } catch { me = { user: null }; }
  if (!me.user) {
    $('#app').classList.add('hide');
    $('#login').classList.remove('hide');
    if (!me.frontReady) { $('#tabFront').title = '前台密码还没设置'; }
    return;
  }
  state.user = me.user; state.can = me.can || {};
  $('#login').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#meName').textContent = me.user.name || '—';
  $('#meRole').textContent = me.user.kind === 'admin' ? '管理员' : '前台访客';
  $('#meAv').textContent = (me.user.name || '?').slice(0, 1).toUpperCase();
  const pill = $('#topPill');
  pill.textContent = me.user.kind === 'admin' ? '管理员' : '前台 · 只读';
  pill.className = 'pill ' + (me.user.kind === 'admin' ? 'ok' : 'acc');
  renderNav();
  refreshStorage();
  await go('files');
}

function renderNav() {
  const c = state.can;
  const items = [
    { k: 'files', t: '文件', ic: '📁', grp: '浏览' },
    { k: 'sheets', t: '表格', ic: '📊', grp: '浏览' },
    { k: 'docs', t: '文档', ic: '📝', grp: '浏览' },
    { k: 'photos', t: '相册', ic: '🖼️', grp: '浏览' },
    { k: 'stars', t: '收藏', ic: '⭐', grp: '浏览' },
    { k: 'recent', t: '最近', ic: '🕘', grp: '浏览' },
  ];
  if (c.accounts) items.push({ k: 'accounts', t: '账号池', ic: '🔑', grp: '管理' });
  if (c.shares) items.push({ k: 'shares', t: '分享', ic: '🔗', grp: '管理' });
  if (c.users) items.push({ k: 'users', t: '用户与密码', ic: '👤', grp: '管理' });
  if (c.tokens) items.push({ k: 'tokens', t: 'API 令牌', ic: '🎫', grp: '管理' });
  if (c.dav) items.push({ k: 'dav', t: 'WebDAV', ic: '🗄️', grp: '管理' });
  if (c.telegram) items.push({ k: 'telegram', t: 'TG 上传', ic: '✈️', grp: '管理' });
  if (c.logs) items.push({ k: 'visits', t: '访问日志', ic: '📈', grp: '管理' });
  if (c.write) items.push({ k: 'trash', t: '回收站', ic: '🗑️', grp: '管理' });
  if (c.write) items.push({ k: 'tags', t: '标签', ic: '🏷️', grp: '管理' });
  if (c.password) items.push({ k: 'account', t: '我的账号', ic: '⚙️', grp: '管理' });

  let html = '', lastGrp = '';
  for (const it of items) {
    if (it.grp !== lastGrp) { html += `<div class="grp">${it.grp}</div>`; lastGrp = it.grp; }
    html += `<a data-k="${it.k}" onclick="go('${it.k}')"><span class="ic">${it.ic}</span>${it.t}</a>`;
  }
  $('#nav').innerHTML = html;
}

function setNav(k) {
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.k === k));
}

async function go(view, opts = {}) {
  state.view = view;
  if (opts.folder !== undefined) state.folder = opts.folder;
  setNav(view);
  toggleSide(false);
  const v = $('#view');
  v.innerHTML = '<div class="empty">载入中…</div>';
  try {
    if (view === 'files') return await renderFiles();
    if (view === 'sheets') return await renderSheets();
    if (view === 'docs') return await renderDocs();
    if (view === 'upload') return await renderUpload();
    if (view === 'accounts') return await renderAccounts();
    if (view === 'shares') return await renderShares();
    if (view === 'users') return await renderUsers();
    if (view === 'tokens') return await renderTokens();
    if (view === 'telegram') return await renderTelegram();
    if (view === 'visits') return await renderVisits();
    if (view === 'dav') return await renderDav();
    if (view === 'account') return await renderAccount();
    if (view === 'photos') return await renderPhotos();
    if (view === 'stars') return await renderStars();
    if (view === 'recent') return await renderRecent();
    if (view === 'trash') return await renderTrash();
    if (view === 'tags') return await renderTags();
    if (view === 'search') return await renderSearch(opts.q || '');
    if (view === 'player') return await renderPlayer(opts.id);
    if (view === 'sheet') return await renderSheetEditor(opts.id);
    if (view === 'doc') return await renderDocEditor(opts.id);
    v.innerHTML = `<div class="card" style="padding:22px"><b>未知页面：${esc(view)}</b></div>`;
  } catch (e) {
    v.innerHTML = `<div class="card" style="padding:22px"><b style="color:#ffb0b3">出错了</b><div class="mut" style="margin-top:6px">${esc(e.message)}</div></div>`;
  }
  refreshStorage();
}

function toggleSide(on) {
  $('#side').classList.toggle('open', on);
  $('#mask').classList.toggle('hide', !on);
}

function crumb(parts) {
  $('#crumb').innerHTML = parts.map((p, i) =>
    i < parts.length - 1
      ? `<span>${esc(p.t)}</span><span class="sep">/</span>`
      : `<b>${esc(p.t)}</b>`).join('');
}

/* ---------- 统计条 ---------- */
function statsHtml(s) {
  const pct = s.capacity ? Math.min(100, (s.used / s.capacity) * 100) : 0;
  const saved = s.dedupSaved || 0;
  return `<div class="stats">
    <div class="stat"><div class="k">📁 文件</div><div class="v">${s.files}<small>个</small></div>
      <div class="mut" style="margin-top:4px">共 ${bytes(s.filesSize)}</div></div>
    <div class="stat"><div class="k">🔑 账号</div><div class="v">${s.accounts}<small>个</small></div>
      <div class="mut" style="margin-top:4px">合计 ${bytes(s.capacity)}</div></div>
    <div class="stat"><div class="k">💾 已用</div><div class="v">${bytes(s.used)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="mut" style="margin-top:6px">${pct.toFixed(1)}% 已占用</div></div>
    <div class="stat"><div class="k">♻️ 去重省下</div><div class="v">${bytes(saved)}</div>
      <div class="mut" style="margin-top:4px">${s.blobs ?? 0} 个内容块 · ${saved ? '重复文件不再占空间' : '还没有重复内容'}</div></div>
  </div>`;
}

/* ---------- 总空间可视化（环形 + 进度条 + 账号数） ---------- */
function ringSvg(pct, size = 46, sw = 4, color = '#4f8cff') {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, cx = size / 2;
  const p = Math.min(100, Math.max(0, pct || 0));
  const on = (p > 0 ? Math.max(p, 1.2) : 0) / 100 * c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="#1c2536" stroke-width="${sw}"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
      stroke-linecap="round" stroke-dasharray="${on} ${c}"/></svg>`;
}
function pctText(pct, used) {
  if (!used) return '0%';
  if (pct < 1) return '<1%';
  return pct.toFixed(pct < 10 ? 1 : 0) + '%';
}
async function refreshStorage() {
  let s;
  try { s = await api('/api/stats'); } catch (e) { return; }
  const box = $('#storage');
  if (!box) return;
  const cap = s.capacity || 0, used = s.used || 0;
  const pct = cap ? Math.min(100, (used / cap) * 100) : 0;
  const hot = pct > 85 ? 'hot' : '';
  box.classList.remove('hide');
  if (!s.accounts) {
    box.innerHTML = `<div class="srow">
        <div class="ring">${ringSvg(0)}<div class="pct">0%</div></div>
        <div class="stxt"><div class="u">还没加账号</div><div class="s">去「账号池」添加 R2 账号</div></div>
      </div>`;
    return;
  }
  box.innerHTML = `<div class="srow">
      <div class="ring">${ringSvg(pct)}<div class="pct">${pctText(pct, used)}</div></div>
      <div class="stxt"><div class="u">${bytes(used)} / ${bytes(cap)}</div>
        <div class="s">${s.accounts} 个账号 · ${s.files} 个文件${s.dedupSaved ? ` · 去重省 ${bytes(s.dedupSaved)}` : ''}</div></div>
    </div>
    <div class="sbar"><i class="${hot}" style="width:${Math.max(cap ? pct : 0, used ? 0.8 : 0)}%"></i></div>`;
}

/* ---------- 文件 ---------- */
async function renderFiles() {
  const q = state.folder === null ? '' : `?folder=${state.folder}`;
  const [{ files }, tree, st] = await Promise.all([api('/api/files' + q), api('/api/tree'), api('/api/stats')]);
  const { sheets } = await api('/api/sheets' + q);
  const { docs } = await api('/api/docs' + q);
  state.folders = tree.folders || [];
  try { const st2 = await api('/api/stars'); state.starred = new Set((st2.files || []).map((x) => x.id)); } catch (e) { state.starred = new Set(); }
  state.pick = new Set();

  // 面包屑
  const path = [];
  let cur = state.folder;
  while (cur) {
    const f = state.folders.find((x) => x.id === cur);
    if (!f) break;
    path.unshift(f); cur = f.parent_id;
  }
  crumb([{ t: '根目录' }, ...path.map((p) => ({ t: p.name }))]);

  const subFolders = state.folders.filter((f) => f.parent_id === state.folder);
  const c = state.can;

  let html = statsHtml(st);
  html += `<div class="page-h"><h2>${state.folder === null ? '全部文件' : esc(path[path.length - 1]?.name || '')}</h2>
    <span class="sub">${files.length} 个文件 · ${subFolders.length} 个目录</span>
    <div class="spacer"></div>
    ${c.write ? `<button class="btn sm" onclick="newFolder()">＋ 新建目录</button>
      <button class="btn sm" onclick="newSheet()">＋ 表格</button>
      <button class="btn sm" onclick="newDoc()">＋ 文档</button>
      <button class="btn sm primary" onclick="go('upload')">⬆️ 上传</button>` : ''}
  </div>`;

  const items = [
    ...subFolders.map((f) => ({ kind: 'folder', ...f })),
    ...docs.map((d) => ({ kind: 'doc', ...d })),
    ...sheets.map((s) => ({ kind: 'sheet', ...s })),
    ...files.map((f) => ({ kind: 'file', ...f })),
  ];

  if (state.folder !== null) {
    const parent = path[path.length - 2]?.id ?? null;
    html += `<div class="dl"><div class="dl-row"><div class="nm"><div class="ico">↩</div>
      <div class="t"><b>.. 返回上级</b></div></div><div class="acts"></div></div></div>`;
  }

  if (!items.length) {
    html += `<div class="card"><div class="empty"><div class="big">🗂</div>
      这里还空着${c.write ? '，拖文件进来或点右上角上传' : ''}</div></div>`;
  } else {
    html += '<div class="dl">';
    for (const it of items) {
      if (it.kind === 'folder') {
        html += row(it.name, `${it.files} 个文件 · ${bytes(it.bytes)}`, '📁',
          `<button class="btn sm" onclick="go('files',{folder:${it.id}})">打开</button>
           ${c.write ? `<button class="btn sm ghost" onclick="renameFolder(${it.id},'${esc(it.name)}')">重命名</button>
           <button class="btn sm danger" onclick="delFolder(${it.id})">删除</button>` : ''}`);
      } else if (it.kind === 'sheet') {
        html += row(it.name, `${it.rows}×${it.cols} · 更新于 ${when(it.updated_at)}`, '📊',
          `<button class="btn sm" onclick="openSheet('${it.id}')">${c.write ? '编辑' : '查看'}</button>
           <a class="btn sm ghost" href="/api/sheets/${it.id}/export">导出</a>
           ${c.write ? `<button class="btn sm danger" onclick="delSheet('${it.id}')">删除</button>` : ''}`);
      } else if (it.kind === 'doc') {
        html += row(it.name, `${bytes(it.size)} · 更新于 ${when(it.updated_at)}`, '📝',
          `<button class="btn sm" onclick="openDoc('${it.id}')">${c.write ? '编辑' : '查看'}</button>
           <a class="btn sm ghost" href="/api/docs/${it.id}?view=1" target="_blank">预览</a>
           ${c.write ? `<button class="btn sm danger" onclick="delDoc('${it.id}')">删除</button>` : ''}`);
      } else {
        const isEnc = !!it.enc;
        const isVideo = !isEnc && /\.(mp4|webm|ogg|mov|m4v)$/i.test(it.name);
        const isImage = /\.(png|jpe?g|gif|webp|bmp|avif|svg)$/i.test(it.name);
        if (isEnc && it.enc_meta) { try { (state.encMeta = state.encMeta || {})[it.id] = JSON.parse(it.enc_meta); } catch (e) {} }
        html += row((isEnc ? '🔒 ' : '') + it.name, `${bytes(it.size)} · ${it.chunks_count} 片 · ${when(it.created_at)}`, fileIcon(it.name),
          `${isImage ? `<button class="btn sm" onclick="previewImage('${it.id}','${esc(it.name)}',${it.size})">预览</button>` : ''}
           ${isVideo ? `<button class="btn sm" onclick="play('${it.id}')">播放</button>` : ''}
           ${isEnc
             ? `<button class="btn sm primary" onclick="decryptDownload('${it.id}','${esc(it.name)}',${it.size},${it.chunk_size || 0})">解密下载</button>`
             : `<button class="btn sm primary" onclick="downloadFile('${it.id}','${esc(it.name)}',${it.size})">下载</button>`}
           ${c.write ? `<label class="pick" onclick="event.stopPropagation()"><input type="checkbox" onchange="togglePick('${it.id}',this.checked)"></label>` : ''}
           <button class="btn sm ghost star ${state.starred && state.starred.has(it.id) ? 'on' : ''}" onclick="toggleStar('${it.id}',this)" title="收藏">★</button>
           ${c.write ? `<button class="btn sm ghost" onclick="editFileTags('${it.id}')" title="标签">🏷️</button>` : ''}
           ${c.write ? `<button class="btn sm ghost" onclick="renameFile('${it.id}','${esc(it.name)}')">重命名</button>` : ''}
           ${c.shares ? `<button class="btn sm ghost" onclick="shareFile('${it.id}')">分享</button>` : ''}
           ${c.write ? `<button class="btn sm danger" onclick="delFile('${it.id}')">删除</button>` : ''}`);
      }
    }
    html += '</div>';
  }
  $('#view').innerHTML = html;
  if (state.folder !== null) {
    const back = $('#view .dl-row');
    if (back) back.onclick = () => go('files', { folder: path[path.length - 2]?.id ?? null });
  }
  wireOpen(items);
}

/** 打开一个条目：目录进目录、表格/文档进编辑器、图片开灯箱、音视频进播放器、其余下载 */
function openItem(it) {
  if (!it) return;
  if (it.kind === 'folder') return go('files', { folder: it.id });
  if (it.kind === 'sheet') return openSheet(it.id);
  if (it.kind === 'doc') return openDoc(it.id);
  const n = it.name || '';
  if (/\.(png|jpe?g|gif|webp|bmp|avif|svg)$/i.test(n)) return previewImage(it.id, n, it.size);

/** 给文件行挂上：双击（PC）、右键菜单、移动端双击 */
function wireOpen(items) {
  const rows = [...document.querySelectorAll('#view .dl .dl-row')];
  const backOffset = state.folder !== null ? 1 : 0;
  rows.forEach((r, i) => {
    const it = items[i - backOffset];
    if (!it || i < backOffset) return;
    r.style.cursor = 'pointer';
    r.title = '双击打开 · 右键更多';
    const isFile = it.kind === 'file';
    r.__item = it;
    r.addEventListener('contextmenu', (e) => {
      if (e.target.closest('button,a')) return;
      e.preventDefault();
      const menu = [];
      menu.push(['打开', () => openItem(it)]);
      if (isFile) menu.push(['下载', () => downloadFile(it.id, it.name, it.size)]);
      if (isFile && state.can.shares) menu.push(['分享', () => shareFile(it.id)]);
      if (state.can.write) menu.push(['剪切', () => setClip('cut', it)]);
      if (state.can.write) menu.push(['复制', () => setClip('copy', it)]);
      if (state.can.write) menu.push(['重命名', () => renameAny(it)]);
      if (state.can.write) menu.push(['删除', () => deleteAny(it), true]);
      showCtxMenu(e.clientX, e.clientY, menu);
    });
  });
  if (!window.__openDelegated) {
    window.__openDelegated = true;
    const rowOf = (e) => (e.target.closest ? e.target.closest('#view .dl-row') : null);
    document.addEventListener('dblclick', (e) => {
      if (e.target.closest('button,a')) return;
      const r = rowOf(e); if (r && r.__item) openItem(r.__item);
    }, true);
    let lastTap = 0;
    const tapHandler = (e) => {
      if (e.target.closest('button,a')) return;
      const r = rowOf(e); if (!r || !r.__item) return;
      const t = Date.now();
      if (lastTap && t - lastTap < 500) { lastTap = 0; openItem(r.__item); }
      else lastTap = t;
    };
    document.addEventListener('touchend', tapHandler, true);
    document.addEventListener('pointerup', (e) => { if (e.pointerType && e.pointerType !== 'mouse') tapHandler(e); }, true);
  }
}

/** 右键菜单：轻量浮层，点外面/Esc 关掉 */
function showCtxMenu(x, y, entries) {
  document.querySelectorAll('.ctxmenu').forEach((n) => n.remove());
  const box = el(`<div class="ctxmenu">${entries.map(([label, , danger], i) =>
    `<button data-i="${i}" class="${danger ? 'danger' : ''}">${esc(label)}</button>`).join('')}</div>`);
  document.body.appendChild(box);
  const w = box.offsetWidth, hgt = box.offsetHeight;
  box.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
  box.style.top = Math.min(y, window.innerHeight - hgt - 8) + 'px';
  box.querySelectorAll('button').forEach((btn) => {
    btn.onclick = () => { const i = Number(btn.dataset.i); box.remove(); entries[i][1](); };

  const cleanup = () => { document.removeEventListener('mousedown', off); document.removeEventListener('keydown', escKey); };

}

/* ---------- 下载（分段续拉，绕开 50 片上限） ---------- */
async function downloadFile(id, name, size) {
  // 有 File System Access 就流式写盘；没有就让浏览器直接下载（服务端会夹断，浏览器自己续）
  if (window.showSaveFilePicker) {
    let handle;
    try { handle = await window.showSaveFilePicker({ suggestedName: name }); } catch { return; }
    const w = await handle.createWritable();
    let start = 0;
    try {
      while (start < size) {
        const res = await fetch(`/api/files/${id}/download`, { headers: { Range: `bytes=${start}-${size - 1}` }, credentials: 'same-origin' });
        if (!res.ok) throw new Error('下载失败 ' + res.status);
        await w.write(await res.arrayBuffer());
        const cr = res.headers.get('Content-Range');
        const m = cr && /\/(\d+)$/.exec(cr);
        const endTo = cr ? Number(/-(\d+)\//.exec(cr)[1]) : size - 1;
        start = endTo + 1;
        if (!m) break;
        // 进度
        toast(`已下载 ${bytes(start)} / ${bytes(size)}`);
        if (start >= size) break;
      }
      await w.close();
      toast('下载完成 ' + name, 'ok');
    } catch (e) {
      try { await w.abort(); } catch {}
      toast(e.message, 'err');
    }
    return;
  }
  location.href = `/api/files/${id}/download?dl=1`;
}

/* ================= 加密文件夹 + 上传队列（断点续传） ================= */

const QU = 'pan.uploadQueue';

function qLoad() { try { return JSON.parse(localStorage.getItem(QU) || '[]'); } catch (e) { return []; } }
function qSave(list) { try { localStorage.setItem(QU, JSON.stringify(list)); } catch (e) {} }
function qPut(rec) { const l = qLoad().filter((x) => x.uploadId !== rec.uploadId); l.push(rec); qSave(l); }
function qDel(uploadId) { qSave(qLoad().filter((x) => x.uploadId !== uploadId)); }

const enc2b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b642u8 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function deriveEncKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function chunkIv(salt, idx) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + idx));
  return new Uint8Array(h).slice(0, 12);
}

async function encChunk(key, buf, salt, idx) {
  return crypto.subtle.encrypt({ name: 'AES-GCM', iv: await chunkIv(salt, idx) }, key, buf);
}
async function decChunk(key, buf, salt, idx) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: await chunkIv(salt, idx) }, key, buf);
}

/** 取当前目录的加密盐；有盐则要口令（同一次会话记住） */
function folderSalt() {
  if (state.folder === null) return null;
  const f = (state.folders || []).find((x) => x.id === state.folder);
  return f && f.enc_salt ? f.enc_salt : null;
}

async function encKeyFor(salt, folderId) {
  const ck = 'enc:' + (folderId === null ? 'root' : folderId);
  let pass = sessionStorage.getItem(ck);
  if (!pass) {
    pass = await askText('这个目录已加密', '输入目录口令（只在本页内存里用，不上传）', '', '口令');
    if (!pass) throw new Error('没有口令，取消上传');
    sessionStorage.setItem(ck, pass);
  }
  return deriveEncKey(pass, salt);
}

/* 上传一个文件：支持加密目录 + 断点续传（分片进度记在 localStorage） */
async function uploadOne(file, onProgress, resume) {
  let chunkSize = resume ? resume.chunkSize : chooseChunk(file.size);
  const salt = folderSalt();
  let key = null;
  if (salt) key = await encKeyFor(salt, state.folder);

  const chunks = Math.max(1, Math.ceil(file.size / chunkSize));
  const declaredSize = salt ? file.size + 16 * chunks : file.size;

  let uploadId, chunksCount, done = new Set(resume ? resume.done || [] : []);
  if (resume) { uploadId = resume.uploadId; chunksCount = resume.chunksCount; }
  else {
    const r = await api('/api/upload/init', {
      method: 'POST',
      body: JSON.stringify({
        name: file.name, size: declaredSize, folderId: state.folder, chunkSize,
        enc: salt ? 1 : 0, encMeta: salt ? JSON.stringify({ salt, v: 1, chunks }) : null,
      }),
    });
    uploadId = r.uploadId; chunksCount = r.chunksCount;
    qPut({ uploadId, name: file.name, size: file.size, folderId: state.folder, chunkSize, chunksCount, done: [] });
  }

  let saved = 0;
  const idxs = [...Array(chunksCount).keys()].filter((i) => !done.has(i));
  const worker = async () => {
    while (idxs.length) {
      const i = idxs.shift();
      const raw = await file.slice(i * chunkSize, Math.min(file.size, (i + 1) * chunkSize)).arrayBuffer();
      const body = key ? await encChunk(key, raw, salt, i) : raw;
      const r = await api(`/api/upload/${uploadId}/chunk/${i}`, {
        method: 'PUT', body, headers: { 'Content-Type': 'application/octet-stream' },
      });
      if (r && r.dedup) saved += r.saved || 0;
      done.add(i);
      const rec = qLoad().find((x) => x.uploadId === uploadId);
      if (rec) { rec.done = [...done]; qSave(qLoad().map((x) => (x.uploadId === uploadId ? rec : x))); }
      onProgress(Math.round((done.size / chunksCount) * 100));
    }
  };
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, Math.max(1, chunksCount)) }, worker));
  const comp = await api(`/api/upload/${uploadId}/complete`, { method: 'POST', body: '{}' });
  qDel(uploadId);
  if (saved > 0) toast(`命中去重，省了 ${bytes(saved)}`, 'ok');
  if (comp && comp.fileId && /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(file.name) && !salt) {
    try { await makeThumbFromBlob(file, comp.fileId); } catch (e) {}
  }
  return comp;
}

/** 加密文件解密下载：拉整份密文，按片解密后另存 */
async function decryptDownload(id, name, size, chunkSize) {
  try {
    const meta = state.encMeta && state.encMeta[id];
    const res = await fetch('/api/files/' + id + '/download?hard=0', { credentials: 'same-origin' });
    if (!res.ok) throw new Error('下载失败 ' + res.status);
    const cipher = await res.arrayBuffer();
    const salt = meta && meta.salt;
    if (!salt) throw new Error('缺少加密信息，无法解密');
    const pass = sessionStorage.getItem('encp:' + id) || (await askText('解密文件', '输入这个目录的口令', '', '口令'));
    if (!pass) throw new Error('没有口令');
    sessionStorage.setItem('encp:' + id, pass);
    const key = await deriveEncKey(pass, salt);
    const csz = chunkSize + 16;
    const out = [];
    for (let i = 0; i * csz < cipher.byteLength; i++) {
      const part = cipher.slice(i * csz, Math.min(cipher.byteLength, (i + 1) * csz));
      out.push(new Uint8Array(await decChunk(key, part, salt, i)));
    }
    const blob = new Blob(out);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name.replace(/\.enc$/, '');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已解密下载', 'ok');
  } catch (e) { toast('解密失败：' + e.message, 'err'); }
}

/* ---------- 相册 / 缩略图 ---------- */
function canvasThumb(blobOrFile, max = 360) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blobOrFile);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob 失败'))), 'image/webp', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片解码失败')); };
    img.src = url;
  });
}

async function thumbPut(blob, fileId) {
  const r = await fetch('/api/files/' + fileId + '/thumb', {
    method: 'PUT', credentials: 'same-origin',
    headers: { 'Content-Type': 'image/webp' }, body: blob,

  if (!r.ok) throw new Error('缩略图上传失败 ' + r.status);
}

async function makeThumbFromBlob(blobOrFile, fileId) {

async function renderSheetEditor(id) {
  const me = await api('/api/me');
  const readOnly = !me.can.write;
  const { sheet } = await api(`/api/sheets/${id}`);
  const map = new Map();
  for (const c of sheet.cells) map.set(`${c.r},${c.c}`, c.v);
  let rows = sheet.rows, cols = sheet.cols;
  const colName = (i) => { let s = '', n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1) / 26 | 0; } return s; };

  crumb([{ t: '表格' }, { t: sheet.name }]);
  $('#view').innerHTML = `
    <div class="page-h">
      <button class="btn sm" onclick="go('files')">← 返回</button>
      <h2 style="font-size:15px" id="sheetName">${esc(sheet.name)}</h2>
      <div class="spacer"></div>
      ${readOnly ? '<span class="pill">只读</span>' : `
        <button class="btn sm" onclick="sheetAddRow()">＋ 行</button>
        <button class="btn sm" onclick="sheetAddCol()">＋ 列</button>
        <label class="btn sm" style="cursor:pointer">导入 TSV/CSV<input type="file" accept=".tsv,.csv,.txt" style="display:none" onchange="sheetImport(this)"></label>
        <a class="btn sm ghost" href="/api/sheets/${id}/export">导出</a>
        <button class="btn sm primary" onclick="sheetSave()">保存</button>`}
    </div>
    <div class="sheet-wrap"><table class="grid" id="grid"></table></div>
    <div class="mut" style="margin-top:10px">支持公式：<code class="mono">=SUM(A1:A9)</code>、<code class="mono">=B1*C1</code>、AVG/MIN/MAX/COUNT。保存后表格出现在前台目录里。</div>`;

  function draw() {
    const t = $('#grid');
    let h = '<tr><th class="corner"></th>';
    for (let c = 0; c < cols; c++) h += `<th>${colName(c)}</th>`;
    h += '</tr>';
    for (let r = 0; r < rows; r++) {
      h += `<tr><th class="rowh">${r + 1}</th>`;
      for (let c = 0; c < cols; c++) {
        const raw = map.get(`${r},${c}`) ?? '';
        const isF = raw.charAt(0) === '=';
        const shown = isF ? (window.SheetEval ? window.SheetEval.displayValue(map, r, c) : raw) : raw;
        h += `<td><input data-r="${r}" data-c="${c}" data-f="${isF ? esc(raw) : ''}" value="${esc(shown)}" class="${isF ? 'fx' : ''}" ${readOnly ? 'readonly' : ''}></td>`;
      }
      h += '</tr>';
    }
    t.innerHTML = h;
    const inputs = [...t.querySelectorAll('input')];
    const commit = (inp) => {
      const k = `${inp.dataset.r},${inp.dataset.c}`;
      if (inp.value === '') map.delete(k); else map.set(k, inp.value);
    };
    // 重算所有「不在编辑中」的公式格显示值
    const refresh = () => {
      for (const inp of inputs) {
        if (inp === document.activeElement) continue;
        const k = `${inp.dataset.r},${inp.dataset.c}`;
        const raw = map.get(k) ?? '';
        if (raw.charAt(0) === '=') {
          inp.dataset.f = raw; inp.classList.add('fx');
          inp.value = window.SheetEval ? window.SheetEval.displayValue(map, +inp.dataset.r, +inp.dataset.c) : raw;
        } else {
          inp.dataset.f = ''; inp.classList.remove('fx'); inp.value = raw;
        }
      }
    };
    for (const inp of inputs) {
      inp.addEventListener('focus', () => { if (inp.dataset.f) inp.value = inp.dataset.f; });
      inp.addEventListener('input', () => commit(inp));
      inp.addEventListener('change', () => commit(inp));
      inp.addEventListener('blur', () => { commit(inp); refresh(); });
    }
    draw.refresh = refresh;
  }
  draw();

  window.sheetAddRow = () => { rows++; draw(); };
  window.sheetAddCol = () => { cols++; draw(); };
  window.sheetSave = async () => {
    const cells = [...map.entries()].map(([k, v]) => { const [r, c] = k.split(',').map(Number); return { r, c, v }; });
    try { await api(`/api/sheets/${id}/save`, { method: 'POST', body: JSON.stringify({ rows, cols, cells }) }); toast('已保存', 'ok'); if (draw.refresh) draw.refresh(); }
    catch (e) { toast(e.message, 'err'); }
  };
  window.sheetImport = async (inp) => {
    const text = await inp.files[0].text();
    try {
      const r = await api(`/api/sheets/${id}/import`, { method: 'POST', body: JSON.stringify({ text }) });
      toast(`导入 ${r.saved} 格`, 'ok'); renderSheetEditor(id);
    } catch (e) { toast(e.message, 'err'); }
  };
}

function mdMini(s) {
  const e = esc(s);
  const lines = e.split('\n');
  const out = []; let code = false, list = null, para = [];
  const inl = (t) => t.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const flush = () => { if (para.length) { out.push('<p>' + para.map(inl).join('<br>') + '</p>'); para = []; } };
  const closeL = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const l of lines) {
    if (/^```/.test(l)) { flush(); closeL(); out.push(code ? '</code></pre>' : '<pre><code>'); code = !code; continue; }
    if (code) { out.push(l); continue; }
    if (!l.trim()) { flush(); closeL(); continue; }
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { flush(); closeL(); out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); continue; }
    if (/^&gt;\s?/.test(l)) { flush(); closeL(); out.push('<blockquote>' + inl(l.replace(/^&gt;\s?/, '')) + '</blockquote>'); continue; }
    if ((m = /^\s*[-*+]\s+(.*)$/.exec(l))) { flush(); if (list !== 'ul') { closeL(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inl(m[1]) + '</li>'); continue; }
    if ((m = /^\s*\d+\.\s+(.*)$/.exec(l))) { flush(); if (list !== 'ol') { closeL(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inl(m[1]) + '</li>'); continue; }
    para.push(l);
  }
  if (code) out.push('</code></pre>');
  flush(); closeL();
  return out.join('\n');
}

async function revokeShare(jti) {
  if (!(await confirmDlg('撤销分享', '这个链接立刻失效，已经发出去的也打不开。'))) return;
  try {
    await api(`/api/shares/${jti}`, { method: 'DELETE' });
  } catch (e) {
    // 404 = 已经没了（可能是过期 / 别处撤了），也当成功处理
    if (!/不存在|已过期/.test(e.message)) { toast(e.message, 'err'); return; }
  }
  // KV 的 list 有缓存，撤销后立刻重读可能还是旧列表 —— 先就地把这行拿掉
  const tr = document.querySelector(`tr[data-jti="${jti}"]`);
  if (tr) tr.remove();
  const rows = document.querySelectorAll('#view table.tb tbody tr');
  const cnt = document.querySelector('#view .page-h .sub');
  if (cnt) cnt.textContent = rows.length + ' 条';
  toast('已撤销', 'ok');
  if (!rows.length) renderShares();
}

          </div></td></tr>`;
      }).join('')
    : '<tr><td colspan="6" class="mut">还没有通道。上面填个 TG 用户名点「创建」，或点右上「＋ 新建 TG 文件夹」。</td></tr>';
  $('#view').innerHTML = `
    <div class="page-h"><h2>TG 上传</h2><span class="sub">每个通道 = 一个落盘目录 + 一份白名单；给机器人发文件自动存进来</span>
      <div class="spacer"></div>
      <button class="btn" onclick="tgNewFolder()">＋ 新建 TG 文件夹</button>
      <button class="btn ghost" onclick="tgView='settings';renderTelegram()">⚙️ 设置</button></div>

    <div class="card" style="padding:18px;margin-bottom:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><b>新建通道</b>
        <span class="pill ${tgCfg.botTokenSet ? 'ok' : 'warn'}">${tgCfg.botTokenSet ? 'Bot 已配置 ' + esc(tgCfg.botTokenMasked) : '还没配 Bot Token，点右上「⚙️ 设置」'}</span></div>
      <div class="row wrap" style="gap:10px;align-items:flex-end">
        <div class="field" style="flex:1;min-width:170px;margin:0"><label>TG 用户名</label><input id="tcUser" class="input mono" placeholder="例如 @dongdong_bot"></div>
        <div class="field" style="flex:1;min-width:170px;margin:0"><label>上传目录</label><select id="tcFolder" class="input">${fopts}</select></div>
        <button class="btn primary" onclick="tgCreateChannel()">创建</button>
      </div>
      <div class="field" style="margin-top:10px"><label>白名单 Chat ID（逗号分隔，留空 = 谁都不收）</label>
        <input id="tcAllowed" class="input mono" placeholder="123456789, -1001234567890"></div>
      <div class="mut" style="margin-top:8px">上传的文件会落到「上传目录」下按 Chat ID 建的子文件夹。不知道 Chat ID？先给 bot 发一句，它会回给你。</div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table class="tb"><thead><tr><th>TG 用户名</th><th>上传目录</th><th>白名单</th><th>状态</th><th>最后收到</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
}
async function tgCreateChannel() {
  const username = ($('#tcUser').value || '').trim();
  if (!username) return toast('先填 TG 用户名', 'warn');
  try {
    await api('/api/tg/channels', {
      method: 'POST',
      body: JSON.stringify({
        botUsername: username,
        folderId: $('#tcFolder').value,
        allowedRaw: $('#tcAllowed').value,
      }),
    });
    toast('通道已创建', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgChanSetName(id, cur) {
  const v = await askText('改管理员命名', '面板里给自己看的名字，用户看不到', cur || '', '例如 手机相册');
  if (v === null) return;
  const n = String(v).trim();
  if (!n) return toast('命名不能为空', 'warn');
  try {
    await api('/api/tg/channels/' + id, { method: 'PATCH', body: JSON.stringify({ name: n }) });
    toast('已保存', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgChanRename(id, cur) {
  const v = await askText('改 TG 用户名', '用户访问这个 bot / 通道时用的名字', cur || '', '@dongdong_bot');
  if (v === null) return;
  const u = String(v).trim();
  if (!u) return toast('用户名不能为空', 'warn');
  try {
    await api('/api/tg/channels/' + id, { method: 'PATCH', body: JSON.stringify({ botUsername: u, name: u }) });
    toast('已保存', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgChanWhitelist(id) {
  try {
    const cd = await api('/api/tg/channels');
    const c = (cd.channels || []).find((x) => x.id === id);
    const v = await askText('白名单 Chat ID', '逗号分隔，留空 = 谁都不收', (c && c.allowed.join(', ')) || '', '123456789');
    if (v === null) return;
    await api('/api/tg/channels/' + id, { method: 'PATCH', body: JSON.stringify({ allowedRaw: v }) });
    toast('已保存', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgChanToggle(id, on) {
  try {
    await api('/api/tg/channels/' + id, { method: 'PATCH', body: JSON.stringify({ enabled: !!on }) });
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgChanDel(id, name) {
  if (!(await confirmDlg('删除通道', '确定删除「' + name + '」？目录里的文件不动。'))) return;
  try {
    await api('/api/tg/channels/' + id, { method: 'DELETE' });
    toast('已删除', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgNewFolder() {
  const name = await askText('新建 TG 文件夹', '建一个目录，并给它开一个 TG 通道', 'TG 上传', '创建');
  if (!name) return;
  try {
    const r = await api('/api/folders', { method: 'POST', body: JSON.stringify({ name, parentId: null }) });
    const fid = (r.folder && r.folder.id) || r.id;
    await api('/api/tg/channels', { method: 'POST', body: JSON.stringify({ botUsername: name, folderId: fid, allowedRaw: '' }) });
    toast('文件夹与通道已创建', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgSave(regen = false) {
  try {
    const body = { regenSecret: !!regen };
    const t = $('#tgToken').value.trim();
    if (t) body.botToken = t;
    await api('/api/tg/config', { method: 'POST', body: JSON.stringify(body) });
    toast('已保存', 'ok');
    renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgClear() {
  try { await api('/api/tg/config', { method: 'POST', body: JSON.stringify({ clearToken: true }) }); toast('已清空', 'ok'); renderTelegram(); }
  catch (e) { toast(e.message, 'err'); }
}
async function renderTgSettings() {
  const d = await api('/api/tg/config');
  tgCfg = d.config;
  crumb([{ t: 'TG 上传' }, { t: '设置' }]);
  const origin = location.origin;
  const hook = tgCfg.secret ? `${origin}/api/tg/webhook/${tgCfg.secret}` : '（先保存，会自动生成 secret）';
  $('#view').innerHTML = `
    <div class="page-h"><button class="btn ghost" onclick="tgView='list';renderTelegram()">← 返回</button><h2>TG 上传 · 设置</h2><span class="sub">机器人 Token、Webhook、大文件地址</span></div>

    <div class="card" style="padding:18px;margin-bottom:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><b>机器人</b>
        <span class="pill ${tgCfg.botTokenSet ? 'ok' : 'warn'}">${tgCfg.botTokenSet ? '已配置 ' + esc(tgCfg.botTokenMasked) : '未配置'}</span></div>
      <div class="field"><label>Bot Token（@BotFather 给的）</label>
        <input id="tgToken" class="input mono" placeholder="${tgCfg.botTokenSet ? '留空 = 不改' : '123456789:AAH...'}" autocomplete="off"></div>
      <div class="row wrap" style="gap:8px">
        <button class="btn primary" onclick="tgSave()">保存</button>
        <button class="btn ghost" onclick="tgSave(true)">重新生成 secret</button>
        ${tgCfg.botTokenSet ? '<button class="btn ghost" onclick="tgClear()">清空 Token</button>' : ''}
      </div>
      <div class="mut" style="margin-top:10px">Webhook 地址：<span class="mono">${esc(hook)}</span></div>
    </div>

    <div class="card" style="padding:18px;margin-bottom:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Webhook</b>
        <span class="mut">${tgCfg.webhookUrl ? '已注册' : '未注册'}</span></div>
      <div class="row wrap" style="gap:8px">
        <button class="btn primary" onclick="tgRegister()">注册 Webhook</button>
        <button class="btn ghost" onclick="tgUnregister()">删除 Webhook</button>
        <button class="btn ghost" onclick="tgRefresh()">刷新状态</button>
      </div>
      <div id="tgInfo" class="mut" style="margin-top:10px"></div>
      ${tgCfg.lastAt ? '<div class="mut" style="margin-top:6px">上次收到文件：' + when(tgCfg.lastAt) + '</div>' : ''}
    </div>

    <div class="card" style="padding:18px;margin-bottom:14px">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><b>大文件：自定义 Bot API 地址</b>
        <span class="pill ${tgCfg.customBase ? 'ok' : 'warn'}">当前上限 ${bytes(tgCfg.maxBytes)}</span></div>
      <div class="mut" style="margin-bottom:10px;line-height:1.8">
        Telegram <b>云</b> Bot API 的 <span class="mono">getFile</span> 只允许机器人下载 <b>20MB</b> 以内的文件。想突破：自己跑官方 <span class="mono">telegram-bot-api</span> 的 <span class="mono">--local</span> 模式，下载不限大小、上传到 2000MB，然后把它的地址填到下面。
      </div>
      <div class="field"><label>Bot API 地址（留空 = 官方 https://api.telegram.org）</label>
        <input id="tgBase" class="input mono" value="${esc(tgCfg.customBase ? tgCfg.apiBase : '')}" placeholder="https://tg-api.你的域名.workers.dev"></div>
      <div class="field"><label>单文件上限（字节，0 = 按地址自动：云 20MB / 本地 2000MB）</label>
        <input id="tgMax" class="input mono" value="${tgCfg.customBase ? tgCfg.maxBytes : 0}" placeholder="0"></div>
      <button class="btn primary" onclick="tgSaveBase()">保存</button>
      <div class="mut" style="margin-top:10px;line-height:1.9">
        本地 Bot API Server 最小跑法（需要 api_id / api_hash，从 <span class="mono">my.telegram.org</span> 拿）：<br>
        <span class="mono">docker run -d --name tg-api -p 8081:8081 -e TELEGRAM_API_ID=xxx -e TELEGRAM_API_HASH=yyy -e TELEGRAM_LOCAL=1 tdlib/telegram-bot-api:latest</span><br>
        它说的是 HTTP，得前面套一层 HTTPS 反代（Caddy / Nginx / Cloudflare Tunnel），再把这个 https 地址填上来。
      </div>
    </div>

    <div class="card" style="padding:18px;margin-bottom:14px">
      <b>管理员 Chat ID</b>
      <div class="mut" style="margin:6px 0 10px;line-height:1.8">
        填在这里的 Chat ID 可以给机器人发管理员命令：<span class="mono">/stats</span>（账号池与用量）、<span class="mono">/channels</span>（通道列表）、<span class="mono">/prune</span>（清理 15 天前的访问日志）。
      </div>
      <div class="field"><label>管理员 Chat ID（逗号分隔，留空 = 没人能用管理员命令）</label>
        <input id="tgAdmins" class="input mono" value="${esc((tgCfg.admins || []).join(', '))}" placeholder="123456789"></div>
      <button class="btn primary" onclick="tgSaveAdmins()">保存</button>
    </div>

    <div class="card" style="padding:18px;margin-bottom:14px">
      <b>机器人命令</b>
      <div class="mut" style="margin-top:8px;line-height:1.9">
        用户：<span class="mono">/help</span> <span class="mono">/id</span> <span class="mono">/me</span> <span class="mono">/files</span> <span class="mono">/usage</span><br>
        管理员：<span class="mono">/stats</span> <span class="mono">/channels</span> <span class="mono">/prune</span><br>
        不是命令的文字消息会回一份帮助；发文件（文档/视频/音频/图片）就直接存进对应通道的目录。
      </div>
    </div>

    <div class="card" style="padding:18px">
      <b>怎么用</b>
      <ol class="mut" style="margin:8px 0 0 18px;line-height:1.9">
        <li>@BotFather 建 bot → 复制 token 填上面 → 保存</li>
        <li>点「注册 Webhook」</li>
        <li>回列表页建一个通道，把 Chat ID 填进白名单</li>
        <li>在 Telegram 里给 bot 发文件（文档 / 视频 / 音频 / 图片）</li>
        <li>文件自动进网盘对应目录，bot 回一句「✅ 已存入」</li>
      </ol>
      <div class="mut" style="margin-top:8px">Telegram 云 Bot API 单文件上限 20MB；想传更大的，用上面「自定义 Bot API 地址」接本地 Bot API Server（上限 2GB）。</div>
    </div>`;
}
async function tgSaveAdmins() {
  try {
    await api('/api/tg/config', { method: 'POST', body: JSON.stringify({ adminsRaw: $('#tgAdmins').value || '' }) });
    toast('已保存', 'ok');
    renderTgSettings();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgSaveBase() {
  try {
    await api('/api/tg/config', { method: 'POST', body: JSON.stringify({ apiBase: $('#tgBase').value.trim(), maxBytes: Number($('#tgMax').value.trim() || 0) }) });
    toast('已保存', 'ok'); renderTelegram();
  } catch (e) { toast(e.message, 'err'); }
}
async function tgRegister() {
  try { await api('/api/tg/register', { method: 'POST' }); toast('Webhook 已注册', 'ok'); renderTelegram(); }
  catch (e) { toast(e.message, 'err'); }
}
async function tgUnregister() {
  try { await api('/api/tg/unregister', { method: 'POST' }); toast('已删除 Webhook', 'ok'); renderTelegram(); }
  catch (e) { toast(e.message, 'err'); }
}
async function tgRefresh() {
  try {
    const d = await api('/api/tg/info');
    const i = d.info || {};
    $('#tgInfo').innerHTML = i.configured
      ? (i.error ? `<span class="pill err">${esc(i.error)}</span>`
        : `<span class="pill ${i.url ? 'ok' : 'warn'}">${i.url ? '已挂 ' + esc(i.url) : '未挂'}</span>
           <span class="pill">待处理 ${i.pending || 0}</span>
           ${i.bot ? `<span class="pill acc">${esc(i.bot)}</span>` : ''}
           ${i.lastError ? `<span class="pill err">最近错误：${esc(i.lastError)}</span>` : ''}`)
      : '<span class="pill warn">还没填 bot token</span>';
  } catch (e) { toast(e.message, 'err'); }
}

boot();

/* 标题彩蛋：首次进入是站名，切走时说句「不要走」，回来时喊「欢迎肥来」 */
const TITLE_BASE = '东东的R2盘';
const TITLE_AWAY = 'w(°Д°)w 不要走';
const TITLE_BACK = '♪(^∇^*)欢迎肥来';
let titleTimer = 0;
document.title = TITLE_BASE;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(titleTimer);
    document.title = TITLE_AWAY;
  } else {
    document.title = TITLE_BACK;
    clearTimeout(titleTimer);
    titleTimer = setTimeout(() => { document.title = TITLE_BASE; }, 5000);
  }
});
</script>
</body>
</html>
