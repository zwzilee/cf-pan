# PAN R2 鈥斺€?澶氳处鍙?R2 鑱氬悎缃戠洏
# 閮ㄧ讲锛歯pm i && npx wrangler login && npx wrangler d1 create pan_r2
#      鎶婁笅闈㈢殑 database_id / kv id 鎹㈡垚鐪熷疄鍊煎悗 npx wrangler deploy
# ===== 閮ㄧ讲鍓嶅繀濉?=====
# 鈿狅笍 涓嬮潰鐨?database_id / [[kv_namespaces]] id 鏄崰浣嶇锛岄儴缃插墠蹇呴』鎹㈡垚浣犺嚜宸辩殑锛?
#    npx wrangler d1 create pan_r2          鈫?鎵撳嵃 database_id
#    npx wrangler kv:namespace create PAN_R2_KV 鈫?鎵撳嵃 id
# 涔熷彲浠ョ敤鐜鍙橀噺娉ㄥ叆锛欴1_DATABASE_ID=... KV_NAMESPACE_ID=... npm run deploy:env
# ======================

name = "pan-r2"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

# 鍓嶇闈欐€佹枃浠讹紙涔熷彲鐢?Pages 鍗曠嫭鎵樼 web/锛?
[assets]
directory = "./web"
binding = "ASSETS"

[vars]
PUBLIC_APP_NAME = "PAN R2"
# 棣栨閮ㄧ讲锛氱鐞嗗憳璐﹀彿锛屽舰濡?"admin:浣犵殑瀵嗙爜"銆傚缓璁敤鐜鍙橀噺 BOOTSTRAP_ADMIN 浼犲叆
# 锛坣pm run deploy:env锛夛紝寤哄ソ绠＄悊鍛樺悗淇濇寔绌哄瓧绗︿覆锛屽埆鎶婄湡瀹炲瘑鐮佸啓杩涜繖涓枃浠?
BOOTSTRAP_ADMIN = ""
# 璁块棶鏃ュ織锛?/鏈=寮€锛?=鍏筹級
LOG_VISITS = "1"
# 鏃ュ織淇濈暀澶╂暟锛堝畾鏃朵换鍔℃瘡 15 澶╂竻涓€娆★紝瓒呰繃杩欎箞涔呭氨鍒狅級
VISIT_KEEP_DAYS = "15"
# 鍥炴敹绔欎繚鐣欏皬鏃舵暟锛堥粯璁?24锛夛細杩囨湡鍚庤嚜鍔ㄧ湡鍒?
TRASH_KEEP_HOURS = "24"
# JWT 绛惧悕瀵嗛挜璇风敤 secret 璁剧疆锛屼笉瑕佸啓鍦ㄨ繖閲岋細
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put MASTER_KEY     # 鍙€夛細鍔犲瘑璐﹀彿瀵嗛挜锛屽己鐑堝缓璁?
#   npx wrangler secret put PUBLIC_SECRET  # 鍓嶅彴璁垮鍑瘉绛惧悕锛堜笉閰嶅垯鐢?JWT_SECRET锛?

[[d1_databases]]
binding = "DB"
database_name = "pan_r2"
database_id = "22b7a53e-4526-4f50-9ea2-3abd9a55e7db"

[[kv_namespaces]]
binding = "KV"
id = "7f86393a862e4994ae8bee814659b96c"

# TG 大文件异步队列：webhook 立即返回，真正下载+入库在 consumer 里跑（最长 15 分钟）
[[queues.producers]]
binding = "TG_QUEUE"
queue = "tg-upload"

[[queues.consumers]]
queue = "tg-upload"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 2
max_retries = 5

# 瀹氭椂娓呯悊璁块棶鏃ュ織锛氭瘡 15 澶╀竴娆★紙姣忔湀 1 鏃ュ拰 16 鏃?04:00 UTC锛?
[triggers]
crons = ["7 * * * *"]

[observability]
enabled = true
